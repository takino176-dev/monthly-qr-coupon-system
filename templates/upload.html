<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <title>Upload Employees CSV</title>
</head>
<body style="font-family: sans-serif; text-align: center; margin-top: 50px;">
    <h2>Upload Employee CSV for Batch Printing</h2>
    <form method="POST" enctype="multipart/form-data">
        <input type="file" name="file" accept=".csv" required style="padding: 10px; font-size: 16px;">
        <br><br>
        <button type="submit" style="padding: 10px 20px; font-size: 16px; background: #28a745; color: white; border: none; cursor: pointer;">Generate Coupons</button>
    </form>
</body>
</html>
